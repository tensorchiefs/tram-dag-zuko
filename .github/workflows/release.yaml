# Tag-driven release: `cz bump` (or a hand-made v* tag) -> build -> PyPI via
# trusted publishing -> sigstore-signed GitHub release. Adapted from
# MArpogaus/minimal_python_project_skeleton (setuptools_scm there, hatch-vcs
# here); TestPyPI job dropped — tags publish straight to PyPI.

name: release

on:
  push:
    tags: [v*]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # hatch-vcs derives the version from the tag
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
    - name: Build the sdist and wheel
      run: uv build
    - uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tramdag
    permissions:
      id-token: write  # trusted publishing — no token secret
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Sign with Sigstore and create the GitHub release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84  # v3.0.0
      with:
        inputs: ./dist/*.tar.gz ./dist/*.whl
    - name: Create the GitHub release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --title '${{ github.ref_name }}'
        --notes 'See CHANGELOG.md for this release.'
    - name: Upload the signed artifacts
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
