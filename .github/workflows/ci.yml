name: CI

on:
  push:
    branches:
    - main
    - dev-*
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: 17 3 * * *     # nightly full suite (03:17 UTC)

# The default Linux torch wheel bundles CUDA and is large. uv's cache,
# keyed on uv.lock, keeps subsequent runs fast. We deliberately do not
# pin Linux to the CPU-only torch index in uv.lock because GPU machines
# (the research rack) share that lock file.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # --no-default-groups: dev is a default group, and it now pulls the
    # editor/docs tooling too (144 packages against 45 for test alone)
    - run: >-
        uv sync --no-default-groups --group test
        --python ${{ matrix.python-version }}

    - name: Tests
      shell: bash
      run: >-
        uv run pytest tests/ -q -n auto
        ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '-m "not slow"' || '' }}
