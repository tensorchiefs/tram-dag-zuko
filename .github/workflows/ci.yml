name: CI

on:
  push:
    branches:
    - main
    - dev-*
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: 17 3 * * *     # nightly full suite (03:17 UTC)

# The default Linux torch wheel bundles CUDA and is large. uv's cache,
# keyed on uv.lock, keeps subsequent runs fast. We deliberately do not
# pin Linux to the CPU-only torch index in uv.lock because GPU machines
# (the research rack) share that lock file.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # --no-default-groups: dev is a default group, and it now pulls the
    # editor/docs tooling too (144 packages against 45 for test alone)
    - run: >-
        uv sync --no-default-groups --group test
        --python ${{ matrix.python-version }}

    # no path argument: testpaths in pyproject covers tests/ and the
    # per-area experiment checks, and both are meant to run here
    - name: Tests
      shell: bash
      # torch opens as many intra-op threads as the box reports, and -n auto
      # already runs one worker per vCPU: uncapped, a single worker was
      # measured at 41 min CPU after 9 min wall without finishing, while the
      # capped run does the whole not-slow suite in under a minute
      env:
        OMP_NUM_THREADS: '1'
      run: >-
        uv run pytest -q -n auto
        ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') && '-m "not slow"' || '' }}
