name: experiments

# The paper replications, one matrix job each. They train real models, so this
# is deliberately NOT on every push: it runs for pull requests into main and on
# demand (Actions -> experiments -> Run workflow).
#
# Each job runs its experiment, compares the metrics against the committed
# ground truth in experiments/ground_truth/, and posts the run's report — table
# plus figures — as a commit comment. CML uploads the figures to its asset
# server, so no branch in this repository holds generated images.
on:
  pull_request:
    branches: [main, dev-*]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      script:
        description: 'run only this script (empty = all)'
        required: false
        default: ''
      variant:
        description: 'run only this variant (needs script)'
        required: false
        default: ''

concurrency:                     # one run per ref; a new push supersedes
  group: experiments-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write                # commit comments

jobs:
  # The matrix comes from the YAML configs, not from a list in this file: a
  # variant added to <script>.yaml is picked up here automatically, and the two
  # can never disagree. A dispatch may narrow it to one script+variant.
  plan:
    # These jobs train real models. A pull request into main always runs them;
    # a pull request into a dev branch runs them only when it carries the
    # 'run-experiments' label, so integration PRs cost nothing by default.
    # (workflow_dispatch needs the workflow on the default branch, so before
    # this file reaches main the label is the only way to trigger a run.)
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.base_ref == 'main'
          || contains(github.event.pull_request.labels.*.name, 'run-experiments') }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        enable-cache: true
    - id: pick
      working-directory: experiments
      env:
        UV_NO_DEFAULT_GROUPS: '1'
        ONLY_SCRIPT: ${{ inputs.script }}
        ONLY_VARIANT: ${{ inputs.variant }}
      run: |
        set -euo pipefail
        uv run --group experiments python - >> "$GITHUB_OUTPUT" <<'EOF'
        import json, os, pathlib, yaml

        only_script = os.environ.get("ONLY_SCRIPT", "")
        only_variant = os.environ.get("ONLY_VARIANT", "")
        include = []
        for path in sorted(pathlib.Path(".").glob("*.yaml")):
            script = path.stem
            for variant in sorted(yaml.safe_load(path.read_text())["variants"]):
                if only_script and (script, variant) != (only_script, only_variant):
                    continue
                include.append({"script": script, "variant": variant})
        if not include:
            raise SystemExit(
                f"no experiment matches script={only_script!r} variant={only_variant!r}"
            )
        print("include=" + json.dumps(include))
        EOF

  replicate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false           # one drifting experiment must not hide the rest
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      UV_NO_DEFAULT_GROUPS: '1'  # dev drags in editor tooling; name the group
      OMP_NUM_THREADS: '2'       # the runners have 2 cores; avoid thread thrash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        enable-cache: true

    - name: run the experiment
      working-directory: experiments
      run: uv run --group experiments python ${{ matrix.script }}.py ${{ matrix.variant }}

    # the results directory of a run: <script-with-dashes>-<variant>, except
    # validate_ls, whose script name carries an underscore
    - name: name the result directory
      id: result
      run: |
        set -euo pipefail
        name="${{ matrix.script }}-${{ matrix.variant }}"
        echo "name=${name//_/-}" >> "$GITHUB_OUTPUT"

    - name: check the metrics against the committed ground truth
      working-directory: experiments
      run: uv run --group experiments python check.py ${{ steps.result.outputs.name }}

    - if: always()               # a drifted run is when the figures matter most
      uses: iterative/setup-cml@v3
    - name: post the report as a commit comment
      if: always()
      working-directory: experiments/results/${{ steps.result.outputs.name }}
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # cml uploads the figures the report links to and rewrites the links
        cml comment create --target=commit report.md
