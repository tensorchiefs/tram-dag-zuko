# Docs: MkDocs site (guides, executed notebooks, API from the numpy
# docstrings) published per ref with mike — main at the site root as
# `latest`, every dev-* branch under its own version — plus one PDF of README,
# guides and executed notebooks typeset by pandoc + XeLaTeX, so the math is
# real math. The PDF is a convenience: its step is continue-on-error and the
# previous copy is republished when it fails.
name: docs
on:
  push:
    branches: [main, dev-*]
  workflow_dispatch:
permissions:
  contents: write   # mike pushes gh-pages
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REF: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 0   # mike reads and writes the gh-pages branch
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d   # v10.0.1
      with:
        enable-cache: true
    - run: uv sync --no-default-groups --group docs --group notebooks

    - name: PDF — README, guides and executed notebooks through pandoc + XeLaTeX
      continue-on-error: true
      timeout-minutes: 25
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex texlive-latex-recommended texlive-fonts-recommended lmodern fonts-dejavu-core
        curl -sSL --max-time 120 --retry 2 -o /tmp/pandoc.deb \
          https://github.com/jgm/pandoc/releases/download/3.5/pandoc-3.5-1-amd64.deb
        sudo dpkg -i /tmp/pandoc.deb
        mkdir -p build/pdf/nb
        # badges are noise in a PDF, and remote images stall the build
        sed -E -e 's#\[!\[[^]]*\]\([^)]*\)\]\([^)]*\)##g' -e 's#!\[[^]]*\]\(https?://[^)]*\)##g' \
          README.md > build/pdf/README.md
        for n in demo_tram_dag_colab intro_tram_dag additive_vs_joint_ci varying_coefficients classical_fit_tram_dag; do
          uv run jupytext --to notebook --execute --output "build/pdf/nb/$n.ipynb" "notebooks/$n.py"
          uv run jupyter nbconvert --to markdown "build/pdf/nb/$n.ipynb" --output "$n" --output-dir build/pdf/nb
        done
        pandoc -f gfm+tex_math_dollars --pdf-engine=xelatex \
          --resource-path=.:docs:build/pdf:build/pdf/nb -V mainfont="DejaVu Serif" -V monofont="DejaVu Sans Mono" \
          -V geometry:margin=2.2cm --toc --toc-depth=2 --metadata title="tramdag documentation" \
          build/pdf/README.md docs/notation.md docs/fitting.md docs/training-speed.md docs/scores.md \
          docs/varying-coefficients.md docs/paper-replication.md docs/code-map.md docs/zuko-upstream.md build/pdf/nb/*.md \
          -o docs/tramdag-docs.pdf

    - name: keep the previous PDF when this build produced none
      run: |
        set -euo pipefail
        if [ ! -f docs/tramdag-docs.pdf ]; then
          dir="$REF"   # mike's latest alias is a symlink git show cannot traverse
          git show "origin/gh-pages:$dir/tramdag-docs.pdf" > docs/tramdag-docs.pdf 2>/dev/null \
            && echo "PDF build failed — republishing the previous PDF" \
            || echo "no PDF this run and none to republish"
        fi

    - name: build and publish the site version for this ref
      env:
        DOCS_EXECUTE: 'true'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "$REF" = main ]; then
          uv run mike deploy --push --update-aliases main latest
          uv run mike set-default --push latest
        else
          uv run mike deploy --push "$REF"
        fi
