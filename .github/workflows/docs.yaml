name: docs

# Each push rebuilds only its own ref's docs:
#   main       -> /
#   dev-<name> -> /dev-<name>/
# The site accumulates on the gh-pages branch. Set Settings -> Pages ->
# Source to "Deploy from a branch": gh-pages, / (root).
#
# Everything is rendered THROUGH pdoc so the whole site shares one look:
# the API reference directly, the docs/*.md guides and the executed
# notebooks via generated stub modules whose docstring includes the
# markdown. The sidebar links live in .github/pdoc-templates/.
on:
  push:
    branches: [main, dev-*]
  workflow_dispatch:

concurrency:              # every run pushes to the same branch
  group: gh-pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write     # pushes gh-pages
    env:
      # the notebooks to execute and publish; add a name to add a notebook
      # (and mirror it in .github/pdoc-templates/module.html.jinja2)
      NOTEBOOKS: demo_tram_dag_colab intro_tram_dag
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        enable-cache: true

    # The kernel runs in the OUTPUT file's directory, and the notebooks
    # resolve data/ relative to that -- so the executed copy must land in
    # notebooks/ (gitignored).
    - name: execute the notebooks
      run: |
        set -euo pipefail
        for name in $NOTEBOOKS; do
          uv run --group dev --group notebooks --with nbconvert \
            jupytext --to notebook --execute \
              --output notebooks/$name.exec.ipynb notebooks/$name.py
        done

    - name: convert executed notebooks to markdown
      run: |
        set -euo pipefail
        mkdir -p build/nbmd
        for name in $NOTEBOOKS; do
          uv run --with nbconvert jupyter nbconvert --to markdown \
            notebooks/$name.exec.ipynb --output $name --output-dir build/nbmd
        done

    - name: generate the guide and notebook stub modules
      run: |
        uv run python - <<'EOF'
        """One stub module per document; its docstring includes the markdown,
        so pdoc renders guides and notebooks with the same chrome as the API.
        """
        import os
        import pathlib

        guides = pathlib.Path("build/stubs/guides")
        examples = pathlib.Path("build/stubs/examples")
        guides.mkdir(parents=True, exist_ok=True)
        examples.mkdir(parents=True, exist_ok=True)
        guides.joinpath("__init__.py").write_text(
            '"""How-to guides: fitting, training speed, scores, '
            'varying coefficients, and the stroke case study."""\n'
        )
        examples.joinpath("__init__.py").write_text(
            '"""The notebooks, executed, with their outputs."""\n'
        )
        for md in sorted(pathlib.Path("docs").glob("*.md")):
            mod = md.stem.replace("-", "_")
            guides.joinpath(f"{mod}.py").write_text(
                f'""".. include:: ../../../docs/{md.name}"""\n'
            )
        for name in os.environ["NOTEBOOKS"].split():
            examples.joinpath(f"{name}.py").write_text(
                f'""".. include:: ../../nbmd/{name}.md"""\n'
            )
        EOF

    - name: build the site with pdoc
      run: |
        uv run --with pdoc env PYTHONPATH=build/stubs \
          pdoc -d numpy --template-directory .github/pdoc-templates \
            -o site tramdag guides examples

    - name: rewrite repo-relative links
      run: |
        uv run python - <<'EOF'
        """Known guide/notebook targets become site links; other repo files
        become GitHub blob URLs.
        """
        import pathlib
        import re

        GH = "https://github.com/tensorchiefs/tramdag/blob/main"
        site = pathlib.Path("site")
        guides = {
            p.stem: p.stem.replace("-", "_") for p in pathlib.Path("docs").glob("*.md")
        }
        notebooks = [p.stem for p in pathlib.Path("notebooks").glob("*.py")]
        total = 0

        def fix(page, basedir, prefix):
            global total

            def repl(m):
                global total
                target = m.group(1)
                if target.startswith(("http://", "https://", "#")):
                    return m.group(0)
                full = str(pathlib.PurePosixPath(basedir) / target)
                while full.startswith("../"):
                    full = full[3:]
                stem = pathlib.PurePosixPath(full).stem
                total += 1
                if full.startswith("docs/") and stem in guides:
                    return f'href="{prefix}guides/{guides[stem]}.html"'
                if full.startswith("notebooks/") and stem in notebooks:
                    return f'href="{prefix}examples/{stem}.html"'
                return f'href="{GH}/{full}"'

            page.write_text(
                re.sub(r'href="([^"]+\.(?:md|py|R))"', repl, page.read_text())
            )

        for page in site.rglob("*.html"):
            rel = page.relative_to(site)
            depth = len(rel.parts) - 1
            basedir = "docs" if depth and rel.parts[0] == "guides" else ""
            fix(page, basedir, "../" * depth)
        print(f"rewrote {total} links")
        EOF

    - name: build the PDF (README + guides)
      run: |
        set -euo pipefail
        # neither pandoc nor weasyprint's pango are preinstalled
        sudo apt-get install -y -qq pandoc libpango-1.0-0 libpangocairo-1.0-0
        uv run --with weasyprint pandoc -f gfm -s \
          --resource-path=.:docs --metadata title="tramdag documentation" \
          README.md docs/*.md -o site/tramdag-docs.pdf --pdf-engine=weasyprint

    - name: publish to gh-pages
      env:
        REF: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch origin gh-pages:gh-pages 2>/dev/null || true
        git worktree add ../pages gh-pages 2>/dev/null \
          || git worktree add --orphan -b gh-pages ../pages

        if [ "$REF" = main ]; then
          # replace the root, keep every dev-* version directory
          find ../pages -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name 'dev-*' -exec rm -rf {} +
          cp -a site/. ../pages/
        else
          rm -rf "../pages/$REF"
          mkdir -p "../pages/$REF"
          cp -a site/. "../pages/$REF/"
        fi

        # until main publishes, give the root a version listing instead of a 404
        if [ ! -f ../pages/index.html ]; then
          { echo "<!doctype html><meta charset=utf-8><title>tramdag docs</title>"
            echo "<h1>tramdag documentation</h1>"
            echo "<p>No release build yet. Available versions:</p><ul>"
            for d in ../pages/dev-*/; do
              v=$(basename "$d")
              echo "<li><a href=\"$v/\">$v</a></li>"
            done
            echo "</ul>"; } > ../pages/index.html
        fi
        # generated site: keep GitHub's Jekyll pass away from it
        touch ../pages/.nojekyll

        cd ../pages
        git add -A
        if git diff --cached --quiet; then
          echo "docs unchanged, nothing to publish"
          exit 0
        fi
        git commit -m "docs: $REF @ ${GITHUB_SHA:0:7}"
        git push origin gh-pages
