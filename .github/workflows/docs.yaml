name: docs

on:
  push:
    branches: [main, dev-marcel]
  workflow_dispatch:

concurrency:              # never let two deployments interleave
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pages replaces the whole site on every deployment, so both versions
      # have to be built in one run: main at /, dev at /dev/.
    - name: check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        ref: main
        path: main
    - name: check out dev
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        ref: dev-marcel
        path: dev
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        enable-cache: true
    - name: build release docs
      working-directory: main
      # --with, not --group: main does not declare a docs group and never has
      # to. This works against any ref, including tags.
      run: uv run --with pdoc pdoc -d numpy -o ../site tramdag
    - name: build dev docs
      working-directory: dev
      run: uv run --with pdoc pdoc -d numpy -o ../site/dev tramdag
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128   # v5.0.0
