name: docs

# Each push rebuilds only its own ref's docs:
#   main       -> /
#   dev-<name> -> /dev-<name>/
# The site therefore accumulates on the gh-pages branch. Set
# Settings -> Pages -> Source to "Deploy from a branch": gh-pages, / (root).
#
# A ref's site is: pdoc API reference (README.md as landing page),
# the docs/*.md guides, and every notebook EXECUTED and rendered to HTML.
# Executing the notebooks is the expensive part (they train real flows),
# hence the long timeout -- and it doubles as a smoke test: a notebook
# that no longer runs fails the docs build.
on:
  push:
    branches: [main, dev-*]
  workflow_dispatch:

concurrency:              # every run pushes to the same branch
  group: gh-pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write     # pushes gh-pages
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9   # v9.0.0
      with:
        enable-cache: true

    # --with, not --group: this works against any ref, whether or not it
    # declares a docs dependency group.
    - name: build API reference
      run: uv run --with pdoc pdoc -d numpy -o site tramdag

    - name: render the docs/*.md guides
      run: |
        set -euo pipefail
        # not preinstalled on the runners (learned the hard way)
        sudo apt-get install -y -qq pandoc
        mkdir -p site/docs
        for f in docs/*.md; do
          pandoc -f gfm -s --metadata title="$(basename "$f" .md)" \
            "$f" -o "site/docs/$(basename "$f" .md).html"
        done
        cp -r docs/img site/docs/ 2>/dev/null || true

    - name: execute the notebooks and render to HTML
      run: |
        set -euo pipefail
        mkdir -p site/notebooks
        # Only the two showcase notebooks for now; the other three train
        # long enough to dominate the run. Add them here when wanted.
        #
        # The executed .ipynb must land in notebooks/: the kernel runs in
        # the OUTPUT file's directory, and the notebooks resolve data/
        # relative to that (an output under /tmp made them look for /data).
        for name in demo_tram_dag_colab intro_tram_dag; do
          uv run --group dev --group notebooks --with nbconvert bash -c "
            jupytext --to notebook --execute \
              --output notebooks/$name.exec.ipynb notebooks/$name.py &&
            jupyter nbconvert --to html notebooks/$name.exec.ipynb \
              --output=$name --output-dir site/notebooks"
        done

    - name: point the landing page's links at the rendered files
      run: |
        set -euo pipefail
        # README links to docs/*.md and notebooks/*.py; the site serves
        # the rendered .html versions of both.
        sed -i -E \
          -e 's|href="(docs/[a-z-]+)\.md"|href="\1.html"|g' \
          -e 's|href="(notebooks/[a-z_]+)\.py"|href="\1.html"|g' \
          site/tramdag.html

    - name: publish to gh-pages
      env:
        REF: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git fetch origin gh-pages:gh-pages 2>/dev/null || true
        git worktree add ../pages gh-pages 2>/dev/null \
          || git worktree add --orphan -b gh-pages ../pages

        if [ "$REF" = main ]; then
          # replace the root, keep every dev-* version directory
          find ../pages -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name 'dev-*' -exec rm -rf {} +
          cp -a site/. ../pages/
        else
          rm -rf "../pages/$REF"
          mkdir -p "../pages/$REF"
          cp -a site/. "../pages/$REF/"
        fi
        # generated site: keep GitHub's Jekyll pass away from it
        touch ../pages/.nojekyll

        cd ../pages
        git add -A
        if git diff --cached --quiet; then
          echo "docs unchanged, nothing to publish"
          exit 0
        fi
        git commit -m "docs: $REF @ ${GITHUB_SHA:0:7}"
        git push origin gh-pages
