# Activate in a fresh clone with (all three stages — plain `install` wires
# up the pre-commit stage only and leaves commitizen dormant):
#   pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-shebang-scripts-are-executable
    exclude: ^data/   # frozen test contract; not ours to chmod
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
  - id: pretty-format-toml
    args: [--autofix]
    exclude: ^uv\.lock$   # uv owns this file; formatting reorders 2883 lines

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  - id: codespell
    # nd: the _Node variable in flow.py; continous: quotes the upstream
    # R script's filename (tensorchiefs/tram-dag), typo and all
    args: [-L, 'nd,continous']
    # TODO: find a way to exclude diff and only check msg
    exclude: ^(data/|uv\.lock|.*\.ipynb$|.*texfrag/|notebooks/stale/|experiments/stale/|.git/COMMIT_EDITMSG)

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.5
  hooks:
  - id: uv-lock   # keep uv.lock in sync when pyproject dependencies change

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.17.1
  hooks:
  - id: commitizen   # conventional-commit message check
    stages: [commit-msg]
  - id: commitizen-branch   # checks every message about to be pushed
    stages: [pre-push]
