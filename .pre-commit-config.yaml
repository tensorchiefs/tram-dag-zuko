# Activate in a fresh clone with (all three stages — plain `install` wires
# up the pre-commit stage only and leaves commitizen dormant):
#   pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-shebang-scripts-are-executable
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
  - id: pretty-format-toml
    args: [--autofix]
    exclude: ^uv\.lock$   # uv owns this file; formatting reorders 2883 lines

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  # nd: the _Node variable in flow.py; continous: quotes the upstream
  # R script's filename (tensorchiefs/tram-dag), typo and all; lik: R prints
  # its log-likelihood as "'log Lik.'", quoted verbatim in a notebook
  - id: codespell
    name: codespell (tracked files)
    args: [-L, 'nd,continous,lik']
    exclude: ^(experiments/.*/data/|uv\.lock|.*\.ipynb$|.*texfrag/)
  # a commit-msg-stage hook is handed ONLY the message file, so the message is
  # spell-checked without the file excludes above applying to it
  - id: codespell
    alias: codespell-commit-msg
    name: codespell (commit message)
    args: [-L, 'nd,continous,lik']
    stages: [commit-msg]

- repo: https://github.com/rohaquinlop/complexipy-pre-commit
  rev: v7.0.1
  hooks:
  # cognitive complexity, tiered: framework code may be intricate where the
  # maths is; examples and tests must stay simple enough to read as prose
  - id: complexipy
    alias: complexipy-src
    name: complexipy (src, max 15)
    args: [--max-complexity-allowed, '15']
    files: ^src/
  - id: complexipy
    alias: complexipy-examples
    name: complexipy (experiments/notebooks/tests, max 10)
    args: [--max-complexity-allowed, '10']
    files: ^(experiments|notebooks|tests)/
    exclude: \.ipynb$   # generated from the .py sources

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint   # workflow syntax, expressions, runner labels, shellcheck

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.5
  hooks:
  - id: uv-lock   # keep uv.lock in sync when pyproject dependencies change

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.17.1
  hooks:
  - id: commitizen   # conventional-commit message check
    stages: [commit-msg]
  - id: commitizen-branch   # checks every message about to be pushed
    stages: [pre-push]
