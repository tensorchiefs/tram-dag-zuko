[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
# dev is the default `uv sync` group: everything a working checkout needs
dev = [
  {include-group = "docs"},
  {include-group = "experiments"},
  {include-group = "notebooks"},
  {include-group = "test"},
  "pre-commit",
  "pylsp-rope",
  # actionlint lints a workflow's shell scripts only when shellcheck is on
  # PATH. Without it, a local hook run silently checks less than CI does.
  "shellcheck-py",
  "python-lsp-ruff",
  "python-lsp-server[all]"
]
docs = [
  "mkdocs-material",
  "mkdocs-autorefs",  # the code map's symbol links
  "mkdocstrings[python]",  # API pages from the numpy docstrings
  "mkdocs-jupyter",  # executes and renders the jupytext notebooks
  "mike",  # one site version per branch on gh-pages
  "nbconvert"  # notebooks -> markdown for the pandoc PDF
]
experiments = [
  "matplotlib",
  "pyyaml",  # the per-experiment hyperparameter files
  "scipy",  # KS tests in the generator checks
  "statsmodels"  # classical reference (OrderedModel in validate_ls.py)
]
notebooks = [
  "jupytext",
  "ipykernel",  # so JupyterLab / VS Code can run the generated .ipynb
  "matplotlib",  # the notebooks plot ...
  "scipy",  # ... and use scipy.stats
  "statsmodels"  # classical_fit_tram_dag.py checks against OrderedModel
]
test = [
  "pytest",
  "pytest-cov",  # the CI coverage gate ([tool.coverage] + `pytest --cov`)
  "pytest-xdist",
  # testpaths covers experiments/ too, so this group must be able to import
  # what those tests import: the generators (scipy), matplotlib through the
  # benchmark modules, and pyyaml for paper/tests/test_configs.py, which reads
  # the four hyperparameter files.
  "matplotlib",
  "pyyaml",
  "scipy",
  "statsmodels"  # exact-MLE agreement tests
]

[project]
authors = [
  {name = "Oliver Dürr", email = "oliver.duerr@gmail.com"},
  {name = "Beate Sick"},
  {name = "Marcel Arpogaus"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "zuko>=1.3",
  "torch>=2.0",
  "numpy",
  "pandas"
]
description = "Interpretable Neural Causal Models (TRAM-DAGs) in PyTorch: one causal normalizing flow for observational, interventional and counterfactual queries"
keywords = [
  "causal-inference",
  "normalizing-flows",
  "transformation-models",
  "counterfactuals",
  "structural-causal-models",
  "interpretability"
]
license = "MIT"
license-files = ["LICENSE"]
name = "tramdag"
readme = "README.md"
requires-python = ">=3.10"
version = "0.3.0"

[project.urls]
Homepage = "https://github.com/tensorchiefs/tramdag"
"Method paper (CLeaR 2025)" = "https://arxiv.org/abs/2503.16206"
"Stroke case study" = "https://arxiv.org/abs/2606.12623"

[tool.coverage.report]
# the fast suite alone measures 97% (2026-08-24); 95 leaves room for noise
# while still failing on an untested new code path
fail_under = 95

[tool.coverage.run]
source = ["src/tramdag"]

[tool.hatch.build.targets.sdist]
# without this, the sdist ships experiments/ (~2 MB frozen CSVs) and tests/;
# README, LICENSE and pyproject.toml ride along automatically
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tramdag"]

[tool.pytest.ini_options]
addopts = ["-v", "--tb=short"]
# -n auto is passed by the CI invocation, not baked into addopts, so a bare
# local `pytest` stays serial and readable. Parallel does pay off: 16 workers
# run the full suite in ~12 min wall against ~24 min serial (32-core box).
markers = [
  "slow: long fit/training tests — excluded from PR CI, run in the nightly full suite"
]
# so `paper.simulations` and `common` import the same way as when a script is
# run with `python -m paper.triangle` from experiments/
pythonpath = ["experiments"]
# The framework suite and the per-area experiment checks both run on a bare
# `pytest`. The experiment tests are cheap (numpy-only generator properties);
# the training runs live in the experiments workflow, not here.
testpaths = ["tests", "experiments"]

[tool.ruff]
# .claude/ is agent tooling, not package code
exclude = [".claude"]
indent-width = 4
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# ruff's default set stays active (in 0.16 that is more than the historical
# E4/E7/E9/F: it includes e.g. S110, BLE001, TRY004); these add to it
extend-select = [
  "I",  # import order
  "E",  # the full pycodestyle errors, beyond the default E4/E7/E9
  "D",  # docstrings (numpy convention below)
  "UP",  # modern syntax
  "B",  # bugbear: real bug patterns (B905: zip truncates silently)
  "C4",  # comprehension misuse
  "C90",  # cyclomatic complexity (cognitive complexity: complexipy hook)
  "NPY",  # numpy pitfalls (legacy random API)
  "PERF",  # accidental quadratic/copy patterns
  "PT",  # pytest style: composite asserts hide which clause failed
  "RUF",  # ruff-native checks (unused noqa, __all__ order)
  "SIM",  # simplifiable constructs
  # the following are clean today (measured 2026-08-24) and bind new code only
  "A",  # builtin shadowing
  "DTZ",  # naive datetimes
  "FURB",  # modernization (refurb)
  "G",  # logging format strings
  "ICN",  # import-alias conventions (np, pd, plt, mpl)
  "ISC",  # implicit string concatenation hides missing commas
  "LOG",  # logging misuse
  "PIE",  # misc correctness/duplication
  "PLW1641",  # __eq__ without __hash__ makes a class silently unhashable
  "PTH",  # pathlib over os.path
  "RET"  # return-statement hygiene
]
ignore = [
  # em-dashes and Greek letters in prose are deliberate (docs/notation.md)
  "RUF001",
  "RUF002",
  "RUF003",
  # dict(arrowstyle=...) as kwargs-style collection literals is deliberate
  # matplotlib idiom in the experiments' plotting code
  "C408",
  # a ternary is not automatically clearer than if/else; keep it a choice
  "SIM108"
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# D103: scripts and tests document themselves in prose and in tests/README.md.
# A docstring per function adds noise, not clarity. (Measured 2026-08-27: these
# are the only rules the directories actually raise.)
"experiments/*" = ["D103"]
# Notebook prose lives in `# %% [markdown]` cells, where a line is a
# paragraph: E501 would force hard wraps into rendered markdown. Their
# docstrings are narrative, so the numpydoc summary rules do not apply.
"notebooks/*" = ["D100", "D103", "D205", "D401", "E501"]
# Test docstrings state what a test guarantees, in prose. They are not API
# documentation, and tests/ is the measurement -- reformatting it is churn.
"tests/*" = ["D103", "D205", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
