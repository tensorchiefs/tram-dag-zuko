[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "pytest",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "matplotlib"
]
docs = [
  "pdoc"
]
notebooks = [
  "jupytext",
  "ipykernel"  # so JupyterLab / VS Code can run the generated .ipynb
]

[project]
authors = [
  {name = "Oliver Dürr", email = "oliver.duerr@gmail.com"},
  {name = "Beate Sick"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "zuko>=1.3",
  "torch>=2.0",
  "numpy",
  "pandas"
]
description = "Interpretable Neural Causal Models (TRAM-DAGs) in PyTorch: one causal normalizing flow for observational, interventional and counterfactual queries"
keywords = [
  "causal-inference",
  "normalizing-flows",
  "transformation-models",
  "counterfactuals",
  "structural-causal-models",
  "interpretability"
]
license = "MIT"
license-files = ["LICENSE"]
name = "tramdag"
readme = "README.md"
requires-python = ">=3.10"
version = "0.3.0"

[project.urls]
Homepage = "https://github.com/tensorchiefs/tramdag"
"Method paper (CLeaR 2025)" = "https://arxiv.org/abs/2503.16206"
"Stroke case study" = "https://arxiv.org/abs/2606.12623"

[tool.basedpyright]
venv = ".venv"
venvPath = "."

[tool.hatch.build.targets.wheel]
packages = ["src/tramdag"]

[tool.pytest.ini_options]
addopts = ["-v", "--tb=short"]
# no -n auto: torch already saturates the cores (the fast subset spends
# 32 min CPU in 2 min wall), so xdist workers only oversubscribe
markers = [
  "slow: long fit/training tests — excluded from PR CI, run in the nightly full suite"
]
testpaths = ["tests"]

[tool.ruff]
# .claude/ is agent tooling, not package code
exclude = [".claude"]
indent-width = 4
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["I", "E", "F", "D", "UP"]

[tool.ruff.lint.per-file-ignores]
# D1xx: scripts, notebooks and tests document themselves in prose and in
# tests/README.md. A docstring per test function adds noise, not clarity.
"experiments/*" = ["D100", "D101", "D102", "D103", "D104"]
# Notebook prose lives in `# %% [markdown]` cells, where a line is a
# paragraph: E501 would force hard wraps into rendered markdown. Their
# docstrings are narrative, so the numpydoc summary rules do not apply.
"notebooks/*" = ["D100", "D101", "D102", "D103", "D104", "D205", "D401", "E501"]
# the pdoc include directive makes README.md the docs landing page; a
# trailing period would break the file name
"src/*/__init__.py" = ["D400"]
# Test docstrings state what a test guarantees, in prose. They are not API
# documentation, and tests/ is the measurement -- reformatting it is churn.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D205", "D400", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
