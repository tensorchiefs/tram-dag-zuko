# Hyperparameters of the continuous-triangle replication (triangle.py).
#
# Every value the script uses is in this file; it reads no defaults of its own.
#
# Protocol = the paper's own code, summerof24/triangle_structured_continous.R
# (tensorchiefs/tram-dag), reproduced 1:1 where the framework allows:
#   * train = dgp(40000), test = dgp(40000): two separate draws, no split;
#   * 500 epochs, optimizer_adam() = Keras Adam at lr 0.001, Keras fit() with
#     its default batch size 32, shuffled; one compiled model, so one
#     continuous optimizer run — the coefficients are read after every epoch
#     (batch and lr are the one deviation below, for CI runtime);
#   * len_theta = 20, hidden_features_I = hidden_features_CS = c(2, 25, 25, 2),
#     sigmoid activations (create_param_net; its ReLU line is commented out);
#   * no learning-rate schedule, no early stopping, final weights.
# Matched on purpose: the Bernstein domain comes from the train 5%/95%
# quantiles, as in the R script (quantile(..., c(0.05, 0.95)); its min/max
# lines are commented out), and the weights start from Keras' random_normal,
# sd 0.05, on weights and biases (`init: normal`, the LinearMasked layers).
# Known deviations, documented in CLAUDE.md: a [-5, 5] instead of a [0, 1]
# domain (a reparametrization), zuko's tied end control points instead of the
# reference's tangent extrapolation, order 21 vs 19 at equal free parameters;
# the R script runs unseeded, so every seed below is a repo choice.

paper_protocol: &paper_protocol
  n_train: 40000          # dgp(40000)
  n_val: 40000            # test = dgp(40000), a separate draw
  epochs: 500             # num_epochs
  # CI-runtime deviation, documented in docs/paper-replication.md: the paper
  # trains at Keras' default batch 32 with optimizer_adam()'s lr 0.001; 500
  # epochs of that are 42-69 min per variant on the CI runners. Batch 256 with
  # the lr scaled 4x runs the same 500 epochs in 8x fewer steps and keeps every
  # ground-truth metric (measured 2026-08-26: cs max err linear-cs 0.132 vs
  # 0.110, atan-cs 0.073 vs 0.080, mixed exp-cs 0.072 vs 0.071; batch 512 /
  # lr 0.01 and lr 0.008 degrade the cs curves, batch 128 / lr 0.001 too).
  learning_rate: 0.004    # paper: 0.001 (optimizer_adam() default)
  batch_size: 256         # paper: 32 (Keras fit() default)
  schedule:               # the reference has no schedule
  transform: bernstein
  # len_theta = 20 unconstrained coefficients; zuko ties two more control
  # points on (order 21 against the reference's 19); the free-parameter count
  # is what matches
  n_coeffs: 20
  dgp_seed: 42
  init_seed: 7
  init: normal                # LinearMasked: random_normal weights and biases (sd 0.05)
  net_input_scaling:          # the triangle scripts feed the nets raw parents
  shuffle_seed: 0
  sample_seed: 0          # sampling for the distribution comparisons
  n_compare: 10000        # rows per distribution panel (Fig. 16/17)
  do_x1: -1.0             # the paper's L2 query, do(x1 = -1)
  grid_low: -1.0          # x2 grid of the complex-shift overlay (Fig. 7 right)
  grid_high: 1.0
  grid_points: 81

# the shift network, from the reference; only a complex-shift variant has one
reference_net: &reference_net
  shift_units: [2, 25, 25, 2]   # hidden_features_CS
  activation: sigmoid           # create_param_net

variants:
  # the linear DGP is the only one with a true beta23 (+0.3) to recover
  linear-ls:
    <<: *paper_protocol
    f: linear
    shift: ls

  # the misspecified case (paper App. C.3.3, Fig. 17): the DGP's x2 -> x3
  # effect is linear, but it is fitted with a complex shift, which must
  # recover that straight line instead of bending to noise
  linear-cs:
    <<: [*paper_protocol, *reference_net]
    f: linear
    shift: cs

  # the headline complex-shift experiment (Fig. 7/15/16)
  atan-cs:
    <<: [*paper_protocol, *reference_net]
    f: atan
    shift: cs

  # a second nonlinear f, to show the shift recovery is not atan-specific
  sin-cs:
    <<: [*paper_protocol, *reference_net]
    f: sin
    shift: cs
