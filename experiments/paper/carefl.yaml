# Hyperparameters of the CAREFL counterfactual benchmark (carefl.py).
#
# Every value the script uses is in this file; it reads no defaults of its own.
#
# Protocol = the reference implementation's own comparison run
# (tensorchiefs/tram-dag, comparison/utils.R with carefl_fig5.r), 1:1:
#   * trains on CAREFL's own 2500 rows (USE_EXTERNAL_DATA = TRUE reads
#     data/CAREFL_CF/X.csv, x3/x4 sd-standardized) — frozen here under
#     data/carefl-cf with the paper's observation and the analytic truth
#     curves, so Fig. 6 is comparable point by point;
#   * val = train (carefl_fig5.r's own choice for the external-data run);
#   * EPOCHS = 7000 at Adam lr 0.001, one full-batch gradient step per epoch
#     (train_step: one apply_gradients over all rows);
#   * update_learning_rate: ReduceLROnPlateau on the summed validation NLL,
#     factor 0.1, patience 50, min_lr 1e-7, no min_delta (strict <);
#   * make_model: one net per node, dense(10, tanh) -> dense(100, tanh) ->
#     dense(len_theta), M = 30 so len_theta = 31; final weights, no early stop;
#   * range_q: 0.0 — the Bernstein domain is the train min/max, scale_df's
#     min-max scaling (the 5%/95% default measurably misweights the tails
#     here: fig6_max_abs_err_x4 0.37 -> 0.20, x3 0.20 -> 0.07);
#   * input_transform: minmax on the CI terms, also scale_df (raw parents
#     saturate the tanh nets — and relu+raw fails too, see
#     docs/paper-replication.md).
# The weights start from Keras' Dense default, glorot_uniform / zero bias
# (`init: glorot`, make_model's layer_dense).
#
# Remaining known deviations, documented in CLAUDE.md: the intercept net's
# output layer has no bias (Keras dense has one); Adam eps 1e-8 vs Keras
# 1e-7 (measured: no effect); the reference seeds R's RNG with 42, which
# torch cannot replay, so every seed below is a repo choice. The earlier
# protocol era — a fresh SCM draw instead of X.csv, 3000 epochs at lr
# 0.002, the quantile domain — and its measurements live in
# docs/paper-replication.md.
#
variants:
  # all conditionals complex intercepts
  flexible:
    n_val: 5000                 # fresh standardized draw, scoring only (R holds nothing out)
    epochs: 7000                # EPOCHS
    learning_rate: 0.001
    batch_size: 2500            # = the row count: one full-batch step per epoch
    schedule: plateau           # update_learning_rate
    plateau_patience: 50
    plateau_factor: 0.1
    plateau_min_lr: 1.0e-7
    min_delta: 0.0
    transform: bernstein
    # M = 30, len_theta = M + 1 = 31 unconstrained coefficients; zuko ties two
    # extra control points on (order 32 against the reference's 30); the
    # free-parameter count is what matches
    n_coeffs: 31
    range_q: 0.0                # scale_df: the domain is the train min/max
    intercept_units: [10, 100]  # make_model's two dense layers
    activation: tanh            # make_model's activation
    dgp_seed: 42                # repo choice (held-out scoring draws only)
    init_seed: 7                # repo choice
    init: glorot                # Keras Dense default: glorot_uniform, zero bias
    input_transform: minmax     # per CI term: comparison/utils.R::scale_df — parents scaled to [0, 1]
    shuffle_seed: 0             # full batch: the shuffle seed has no effect
    n_heldout: 300              # typical rows scored next to the single x_obs
    heldout_seed_offset: 999    # seed offset of the held-out draw
    alphas_scored: [-1.5, 0.0, 1.5]
